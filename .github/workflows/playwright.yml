name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag filter passed to --grep, e.g. @smoke or @hybrid'
        required: false
        default: ''
      run_ui:
        description: 'Also run the UI + hybrid shards (the public site usually blocks CI IPs)'
        type: boolean
        required: false
        default: false

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  # Passed through env, never interpolated into a script, so the input cannot inject shell.
  TAG: ${{ inputs.tag }}

jobs:
  static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  api:
    name: API tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run API tests
        run: npx playwright test --project=api ${TAG:+--grep "$TAG"}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: blob-report/
          retention-days: 3

  # The public demo sits behind Cloudflare, which serves a "Verify you are human" challenge to
  # GitHub-hosted (datacenter) runner IPs. The suite does not try to get past it, so UI and
  # hybrid tests are verified from a local machine. The job stays here for a manual run with
  # run_ui: true (useful from a self-hosted runner or if the site stops blocking), and the setup
  # project fails fast with a clear message when the challenge appears.
  ui:
    name: UI + hybrid tests (shard ${{ matrix.shard }}/2)
    needs: static
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI, hybrid and mobile tests
        # Each shard runs the setup project for its own tests, so each registers its own run user.
        run: >-
          npx playwright test
          --project=chromium --project=chromium-write --project=mobile
          --shard=${{ matrix.shard }}/2
          ${TAG:+--grep "$TAG"}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ui-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  report:
    name: Merge reports
    needs: [api, ui]
    # Runs whether the ui job ran, failed or was skipped; merges whatever blob reports exist.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
